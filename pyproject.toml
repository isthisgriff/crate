[project]
name = "crate"
version = "0.1.0"
description = "Local-first, AI-assisted sample library manager for music producers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Griffin Prince" }]

# Core: scanning, decoding and playback. Qt is an extra so that headless
# work (scanning a NAS over SSH, and Phase 3's analysis workers) does not
# need a GUI toolkit installed.
dependencies = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "sounddevice>=0.4",
]

[project.optional-dependencies]
ui = [
  "PySide6>=6.7",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-qt>=4.4",
  "ruff>=0.6",
  "mypy>=1.11",
  "PySide6>=6.7",
]

[project.scripts]
crate = "crate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: tests that touch large fixtures or real audio decoding",
  "gui: tests that need a Qt application (skipped without a display)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "TID", "SLF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals on purpose: driving the audio callback and
# asserting on widget state is the point.
"tests/*" = ["SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["crate"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sounddevice.*", "soundfile.*"]
ignore_missing_imports = true

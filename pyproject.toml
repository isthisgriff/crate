[project]
name = "crate"
version = "0.1.0"
description = "Local-first, AI-assisted sample library manager for music producers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Griffin Prince" }]

# Phase 1 deliberately has ZERO runtime dependencies. Everything it needs
# (filesystem walking, sqlite3, tomllib, argparse) is in the stdlib.
# Audio/ML dependencies arrive in Phase 3+ as optional extras.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
crate = "crate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: tests that touch large fixtures or real audio decoding",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "TID", "SLF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["crate"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
